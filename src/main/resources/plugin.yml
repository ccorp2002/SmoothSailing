name: SmoothSailing
main: com.ccorp2002.smoothsailing.SmoothSailingPlugin
version: ${version}
api-version: 1.21
author: C_Corp2002
description: "SmoothSailing - Working Block-based ships for all!"
softdepend: [ProtocolLib, CraftEngine, Towny, WorldGuard, Cannons]
commands:
  smoothsailing:
    description: SmoothSailing plugin commands
    usage: |
      /smoothsailing reload - Reload the plugin configuration and applies the new or updated options.
      /smoothsailing cruise - Forces your SmoothSailing Ship to move forwards for a period of time.
      /smoothsailing release - Releases/unpilots your SmoothSailing Ship(s)
      /smoothsailing releaseall - Releases/unpilots all SmoothSailing Ships
    permission: smoothsailing.admin
  savefuel:
    usage: "Saves a player's held item to a basic FuelType in the config.yml; Requires the permission: 'smoothsailing.admin'."
    permission: smoothsailing.admin
  gear:
    usage: Cycles through your ships gears.
    aliases: ["gears"]
    permission: smoothsailing.gears
  release:
    usage: Same as /smoothsailing release - Releases/unpilots your SmoothSailing Ship(s)
    aliases: ["unpilot"]
    permission: smoothsailing.release

permissions:
  smoothsailing.gears:
    description: Cycles through your ships gears.
    default: true
  smoothsailing.release:
    description: Allows remotely unpiloting a ship
    default: true
  smoothsailing.releaseall:
    description: Allows unpiloting all active ships (admin command)
    default: op
  smoothsailing.cruise:
    description: Makes the executor's currently boarded ship cruise straight for 50 movements.
    default: op
  smoothsailing.reload:
    description: Allows reloading the plugin configuration file and its options.
    default: op
  smoothsailing.admin:
    description: Allows all admin commands (reload, releaseall, savefuel)
    default: op