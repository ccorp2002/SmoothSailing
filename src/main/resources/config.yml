# SmoothSailing Plugin Configuration (Stripped down from BlockShips' Config)

water-level: 62  # Default/fallback water-level, if none is automatically found for a sailing ship.
# ^ May eventually be migrated to a per-world option, with this as a fallback, but not ready yet.

hard-max-speed: 75  # Hard max speed, no vehicle can go faster than this; Does not factor in Gears/Engines & API Usage.
# ^ A higher max speed may increase the maximum distance a ship can "drift" after stopping movement inputs.

max-ship-size: 28500  # Maximum number of blocks in a ship.
max-scan-size: 28700  # Maximum blocks to scan when ship hits the above limit (for reporting actual size.)

# Buoyancy system - weight-based floating
# Ships float based on their density (total weight / block count) compared to fluid density, like `water` for this example:
# - Density < water: floats higher (surface offset increases)
# - Density = water: neutral (floats around the water surface)
# - Density > water: sinks lower (surface offset decreases, eventually submerging)

# Drag Modifier system - How fast a ship decelarates in the primary fluid medium (whichever the ship is exposed the most to, does not count Air, if a vehicle is touching anything else).
buoyancy:
  # Reference density of air (ships lighter than this become airships)
  air-density: -3.0
  # Controls Deceleration of a vehicle in an Air-type fluid medium. Applies when movement inputs have stopped.
  air-drag-mod: 1.25 # -1.25 speed while going without movement input.

  # Reference density of water (ships lighter than this become sailing ships, and ships heavier may become submerged, where the water-level becomes their max height)
  water-density: 10.0
  # Controls Deceleration of a vehicle in an Water-type fluid medium.
  water-drag-mod: 2.5 # -2.5 speed while going without movement input.
  
  # Reference density of lava (ships lighter than this may become lava-ships, and ships heavier may become submerged, where the lava-level becomes their max height)
  lava-density: 25.0
  # Controls Deceleration of a vehicle in an Lava-type fluid medium.
  lava-drag-mod: 5.0 # -5 speed while going without movement input. (Acts like a very viscous/thick fluid, thats difficult to move through.)

signs:
  helm: "[helm]"
  # Rotates the ship this sign is aboard.
  turret: "[turret]"
  # Rotates a subsection of a vehicle separately (assuming it isn't stuck to the rest of the larger ship).
  # Subsections created with this method will not attach/stick to blocks with the `turret_base` property set to `true`.
  extend: "[extend]"
  # Similar to the turret sign, but allows the user to extend (right click) or retract (left click) the subsection of ship.
  # Subsections created with this method will not attach/stick to blocks with the `turret_base` or `launch_pad` property set to `true`.
  detach: "[detach]"
  # Similar to Extend, but, instead turns the moved subsection into its own independant ship without needing another lectern.
  # Subsections created with this method will not attach/stick to blocks with the `launch_pad` property set to `true`.
  # Useful for launching fighters off the deck of a carrier for example.
  thrust: "[thrust]"
  # Changes Gears without requiring the command.
  remote: "[remote]"
  # Remotely interact with any other signs (except for other Remote Signs and Helm Signs).

# Compatibility Options
towny:
  allied:
    can-pilot-blocks: true
    can-passthrough: true
  trusted:
    can-pilot-blocks: false
    can-passthrough: true
  outsider:
    can-pilot-blocks: false
    can-passthrough: true
  enemy:
    can-pilot-blocks: false
    can-passthrough: true

worldguard:
  enabled: true

debug:
  enabled: false # Debug logs may be spammy but will also help with determining what is going on with a ships (lack of) movement.

fuel-types:
