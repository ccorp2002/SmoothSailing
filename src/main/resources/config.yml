    - H4sIAAAAAAAA/+NiYGBm4HZJLEkMSy0qzszPY2AQns/BwJSZwiCUm5mXmlyUmFZilZyRWJScn5jDzMCanF+aV8LAwMDIAACXaq+xOwAAAA==
    id: char_and_coal
    chance: 0.75
