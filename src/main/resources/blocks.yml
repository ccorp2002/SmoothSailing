# BASIC ENGINE & (BLOCK-DATA) CONFIG

# (ENGINES HELP DETERMINE HOW MANY GEARS A SHIP HAS AT A GIVEN TIME)
redstone_lamp:
  allowed: true
  weight: 15
  health: 25
  engine: false
  fuel_cost: 0.25 # AMOUNT OF ADDITIONAL FUEL BURNT BY 1 BLOCK OF THIS TYPE
                  # MAY BE A NEGATIVE VALUE TO REDUCE THE OVERALL FUEL COST
  block_data:
    "redstone_lamp[lit=true]": # MUST SPECIFY THE WHOLE BLOCKDATA STRING TO WORK
      allowed: true
      engine: true

furnace: # FUEL INPUT FOR ENGINES
  allowed: true
  weight: 7
  health: 5
  engine: false
  block_data:
    "furnace[lit=true]": # (LIT FURNACES COUNT AS ENIGNES TOO)
      fuel_cost: 0.5 # (FUEL COST DOES NOT GO DOWN WITH BLOCK LOSS/DAMAGE)
                     # FUEL USAGE IS AMPLIFIED BY A SHIPS CURRENT GEAR.
      allowed: true
      engine: true


note_block:
# ENABLE IF CUSTOM-BLOCK PLUGIN IS INSTALLED
# (CURRENTLY SEMI-COMPATIBLE: CRAFTENGINE - Others Unknown)
  allowed: false
  weight: 5

